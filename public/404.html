<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>NATIVA – Redirigiendo...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, then redirects the browser to the new url with supplied path
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: sans-serif; background-color: #F3EBDD; color: #285943; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="font-size: 24px; margin-bottom: 8px;">NATIVA</h2>
      <p style="font-size: 14px; opacity: 0.8;">Cargando bienestar natural...</p>
    </div>
  </body>
</html>
